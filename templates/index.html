<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Inventory System - Dashboard</title>
    <style>
        :root {
            --primary: #c8ff00;
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 1rem 2rem;
            background: var(--surface);
            border-bottom: 2px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 1rem;
            padding: 1rem;
            flex-grow: 1;
        }

        .video-box {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-box img {
            max-width: 100%;
            height: auto;
        }

        .sidebar {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        h2 { color: var(--primary); margin-top: 0; font-size: 1.2rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; padding: 0.8rem; border-bottom: 1px solid #444; color: #888; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 1rem 0.8rem; border-bottom: 1px solid #333; }
        
        .stock-val {
            font-weight: bold;
            color: var(--primary);
            background: rgba(200, 255, 0, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
        }

        .badge-live {
            background: #ff0000;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
    <script>
        function updateInventory() {
            fetch('/api/inventory')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('inventory-body');
                    tbody.innerHTML = '';
                    for (const [item, count] of Object.entries(data)) {
                        const row = `<tr>
                            <td>${item.toUpperCase()}</td>
                            <td><span class="stock-val">${count}</span></td>
                        </tr>`;
                        tbody.innerHTML += row;
                    }
                });
        }
        setInterval(updateInventory, 2000);
    </script>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <h1 style="margin:0; font-size: 1.5rem;">AI INVENTORY <span style="color:var(--primary)">V4.0</span></h1>
            <span class="badge-live">HTTP LIVE</span>
        </div>
        <div id="status" style="color: #888; font-size: 0.9rem;">Servidor Operacional</div>
    </header>

    <div class="container">
        <div class="video-box">
            <img src="{{ url_for('video_feed') }}" alt="Câmera Offline">
        </div>
        <div class="sidebar">
            <h2>CONTROLE DE ESTOQUE</h2>
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Qtd</th>
                    </tr>
                </thead>
                <tbody id="inventory-body">
                    <!-- Gerado via JS -->
                </tbody>
            </table>
            <div style="margin-top: auto; font-size: 0.8rem; color: #555;">
                * Sincronizado automaticamente
            </div>
        </div>
    </div>
</body>
</html>
